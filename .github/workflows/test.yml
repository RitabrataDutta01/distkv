name: distkv-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Enforce Formatting
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then echo "Format errors found. Run 'gofmt -w .'"; exit 1; fi

      - name: Run Tests & Race Detector
        run: go test -v -race ./...
